<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NEXORA Gaming Lounge</title>
  <meta name="description" content="NEXORA Gaming Lounge — Alexandria, Egypt. Play more. Connect more. Level up.">
  <meta name="theme-color" content="#070b14">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background: neon image (background.webp) + a shade that keeps the text readable -->
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-shade"></div>

  <header class="top">
    <a href="#home" class="logo">NEXORA<span>.</span></a>
    <button class="share" id="shareBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      <span id="shareLabel">SHARE</span>
    </button>
  </header>

  <main class="center" id="home">
    <p class="eyebrow"><i></i>YOUR NEXT LEVEL STARTS HERE<i></i></p>

    <h1>
      <span class="line-1">NEXORA</span>
      <span class="line-2">GAMING LOUNGE</span>
    </h1>

    <p class="location">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      ALEXANDRIA, EGYPT
    </p>
    <p class="tagline">Play more. Connect more. Level up.</p>

    <nav class="links">
      <a class="link" data-link="maps" target="_blank" rel="noopener">
        <span class="ico ico-cyan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        </span>
        <span class="label">Google Maps</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
      <a class="link" data-link="instagram" target="_blank" rel="noopener">
        <span class="ico ico-purple">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" class="dot"/></svg>
        </span>
        <span class="label">Instagram</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
      <a class="link" data-link="tiktok" target="_blank" rel="noopener">
        <span class="ico ico-cyan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5M14 3c.4 2.6 2.2 4.4 5 4.7"/></svg>
        </span>
        <span class="label">TikTok</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
      <a class="link" data-link="facebook" target="_blank" rel="noopener">
        <span class="ico ico-blue">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H9v3h2.5V21"/></svg>
        </span>
        <span class="label">Facebook</span>
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg>
      </a>
    </nav>

    <p class="step"><i></i>STEP INTO YOUR NEXT GAME</p>
  </main>

  <footer class="bottom">
    <span>NEXORA GAMING LOUNGE</span>
    <span class="game-on"><i></i>GAME ON</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
